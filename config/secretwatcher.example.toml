# 秘钥守望者公开配置模板
#
# 使用方法：
#   1. 复制为 config/secretwatcher.local.toml
#   2. 填写非敏感的域名、服务器 IP 和职责
#   3. 通过进程环境提供 VOLCENGINE_ACCESS_KEY_ID 和
#      VOLCENGINE_SECRET_ACCESS_KEY
#
# 禁止把 AccessKey、SecretAccessKey、SSH 私钥或服务器密码写入本文件。

[project]
name = "秘钥守望者"
slug = "secretwatcher"
mode = "public_interest"
timezone = "Asia/Shanghai"

[domain]
provider = "volcengine"
zone = "cyberstroll.top"
public_host = "www.cyberstroll.top"

[domain.credentials]
# 这里只填写环境变量名称，不填写真实凭据。
access_key_id_env = "VOLCENGINE_ACCESS_KEY_ID"
secret_access_key_env = "VOLCENGINE_SECRET_ACCESS_KEY"

[domain.safety]
# 默认只生成变更计划；真正修改 DNS 时必须显式确认。
apply_changes = false
protect_root_record = true
protect_mail_records = true
allowed_record_types = ["A", "AAAA", "CNAME", "TXT"]

# 四台服务器的初始清单。请在 local 文件中填写公网 IP 和实际职责。
[[servers]]
id = "server-01"
name = "资产发现节点"
role = "discovery"
provider = "unknown"
public_ipv4 = ""
public_ipv6 = ""
ssh_host = ""
ssh_port = 22
ssh_user = ""
ssh_identity_file = ""
enabled = false
dns_records = ["radar.cyberstroll.top"]

[[servers]]
id = "server-02"
name = "风险分析节点"
role = "analysis"
provider = "unknown"
public_ipv4 = ""
public_ipv6 = ""
ssh_host = ""
ssh_port = 22
ssh_user = ""
ssh_identity_file = ""
enabled = false
dns_records = ["engine.cyberstroll.top"]

[[servers]]
id = "server-03"
name = "通知与任务节点"
role = "notification"
provider = "unknown"
public_ipv4 = ""
public_ipv6 = ""
ssh_host = ""
ssh_port = 22
ssh_user = ""
ssh_identity_file = ""
enabled = false
dns_records = ["notify.cyberstroll.top"]

[[servers]]
id = "server-04"
name = "Web 与数据节点"
role = "web_data"
provider = "unknown"
public_ipv4 = ""
public_ipv6 = ""
ssh_host = ""
ssh_port = 22
ssh_user = ""
ssh_identity_file = ""
enabled = false
dns_records = ["www.cyberstroll.top", "api.cyberstroll.top"]

[operations]
# 服务器管理默认也是只读计划模式。
apply_changes = false
require_confirmation_for_dns = true
require_confirmation_for_restart = true
require_confirmation_for_firewall = true
require_confirmation_for_delete = true

[monitoring]
health_interval_seconds = 60
notify_on_unreachable = true
notify_on_dns_drift = true
notify_on_certificate_expiry_days = 21

